<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c44dff">
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
    <title>💕 情侣小游戏</title>
    <style>
        :root{--pink:#ff6b9d;--purple:#c44dff;--rose:#ff4d6a}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;min-height:100dvh;background:linear-gradient(160deg,#fff0f5 0%,#f8e8ff 25%,#ffe0ec 50%,#f3e6ff 75%,#fff0f5 100%);background-attachment:fixed;overflow-x:hidden}
        .hearts-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .heart-float{position:absolute;opacity:.1;animation:floatUp linear infinite}
        @keyframes floatUp{0%{transform:translateY(105vh) scale(.3) rotate(0deg);opacity:0}10%{opacity:.1}90%{opacity:.1}100%{transform:translateY(-10vh) scale(1.1) rotate(360deg);opacity:0}}
        .container{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:20px 16px 40px}
        .header{text-align:center;margin-bottom:14px}
        .header .icon{font-size:38px;animation:bounce 2s infinite;display:inline-block}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .header h1{font-size:clamp(22px,5vw,30px);background:linear-gradient(135deg,var(--rose),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
        .header p{color:#b8a8cc;font-size:13px}
        .card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 4px 16px rgba(150,100,180,.1);text-align:center;margin-bottom:12px}
        .btn{display:inline-block;padding:11px 22px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
        .btn:active{transform:scale(.95)}
        .btn-primary{background:linear-gradient(135deg,#ff4d6a,#c44dff);color:#fff;box-shadow:0 4px 12px rgba(196,77,255,.25)}
        .btn-outline{background:#fff;color:#8b6bab;border:2px solid #e8ddf5}
        .btn-sm{padding:7px 14px;font-size:12px}
        .btn-block{display:block;width:100%;margin:6px 0}
        .room-code{font-size:34px;font-weight:900;letter-spacing:4px;color:#c44dff;margin:8px 0}
        .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;margin:2px}
        .badge-me{background:#f8f0ff;color:#c44dff}
        .badge-other{background:#e8f8ff;color:#4d6aff}
        .badge-wait{background:#fff5f5;color:#ccc;border:1px dashed #ddd}
        .game-cards{display:flex;flex-direction:column;gap:10px}
        .game-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 12px rgba(150,100,180,.08);cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:12px}
        .game-card:hover{transform:translateY(-2px)}
        .game-card:active{transform:scale(.97)}
        .game-card .gc-icon{font-size:36px}
        .game-card .gc-name{font-weight:800;color:#3d2b4d;font-size:16px}
        .game-card .gc-desc{font-size:11px;color:#b8a8cc}
        .quiz-q{font-size:18px;font-weight:700;color:#3d2b4d;margin:10px 0;line-height:1.5}
        .quiz-opts{display:flex;flex-direction:column;gap:7px;margin:10px 0}
        .quiz-opt{padding:11px 13px;border:2px solid #e8ddf5;border-radius:14px;font-size:14px;font-weight:600;color:#3d2b4d;cursor:pointer;transition:all .2s;text-align:center}
        .quiz-opt:active{transform:scale(.96)}
        .quiz-opt.picked{border-color:#c44dff;background:#f8f0ff}
        .quiz-opt.locked{pointer-events:none;opacity:.7}
        .quiz-opt.match{border-color:#22c55e;background:#f0fff4}
        .quiz-opt.mismatch{border-color:#ef4444;background:#fff5f5}
        .rps-row{display:flex;justify-content:center;gap:12px;margin:12px 0}
        .rps-btn{width:60px;height:60px;border-radius:50%;border:3px solid #e8ddf5;font-size:28px;cursor:pointer;background:#fff;transition:all .2s}
        .rps-btn:active{transform:scale(.9)}
        .rps-btn.picked{border-color:#c44dff;background:#f8f0ff;transform:scale(1.1)}
        .rps-btn.locked{pointer-events:none;opacity:.5}
        .td-card{background:linear-gradient(135deg,#fff0f5,#f8e8ff);border-radius:16px;padding:22px 16px;text-align:center;margin:10px 0;font-size:16px;font-weight:700;color:#3d2b4d;line-height:1.6;min-height:70px;display:flex;align-items:center;justify-content:center}
        .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-right:4px}
        .tag-truth{background:#ffe0ec;color:#ff4d6a}
        .tag-dare{background:#e0ecff;color:#4d6aff}
        .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:2000;padding:11px 20px;border-radius:14px;font-weight:700;font-size:13px;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:slideDown .4s}
        @keyframes slideDown{from{transform:translateX(-50%) translateY(-60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
        .toast-success{background:linear-gradient(135deg,#22c55e,#16a34a)}
        .toast-info{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
        .toast-error{background:linear-gradient(135deg,#ef4444,#dc2626)}
        .hidden{display:none!important}
        .mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}
        .connecting{animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .status-bar{font-size:11px;color:#b8a8cc;margin-top:4px}
        .status-bar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
        .dot-green{background:#22c55e}.dot-red{background:#ef4444}.dot-yellow{background:#f59e0b}
    </style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>
<div class="container" id="app"></div>

<script>
// ==================== 题库 ====================
const QUIZ=[{q:'喜欢猫还是狗？',opts:['🐱 猫','🐶 狗','都喜欢','都不喜欢']},{q:'最喜欢的颜色？',opts:['🔴 红/粉','🔵 蓝/紫','🟢 绿','🟡 黄/橙','⚫ 黑/白']},{q:'咖啡还是奶茶？',opts:['☕ 咖啡','🧋 奶茶','都不喝']},{q:'早起鸟还是夜猫子？',opts:['🌅 早起','🌙 夜猫','看情况']},{q:'喜欢夏天还是冬天？',opts:['☀️ 夏天','❄️ 冬天','春秋']},{q:'更喜欢海边还是山？',opts:['🌊 海边','⛰️ 山里','都喜欢']},{q:'火锅必点的三样之一？',opts:['🥩 肉','🥬 蔬菜','🍜 主食','🫕 丸子']},{q:'下雨天最喜欢做什么？',opts:['📖 看书追剧','😴 睡觉','🍜 吃火锅','🎧 听音乐']},{q:'最想去旅行的地方？',opts:['🗼 日本','🏝️ 海岛','🏔️ 雪山','🏛️ 欧洲','🏜️ 国内']},{q:'最喜欢的电影类型？',opts:['😂 喜剧','😱 恐怖','💕 爱情','🚀 科幻','🎬 动画']},{q:'苹果还是安卓？',opts:['🍎 苹果','🤖 安卓']},{q:'最喜欢的音乐类型？',opts:['🎵 流行','🎸 摇滚','🎹 古典','🎤 说唱','🎧 民谣']},{q:'宅家还是出门？',opts:['🏠 宅家','🚶 出门','看心情']},{q:'吃香菜吗？',opts:['✅ 吃','❌ 不吃']},{q:'早上洗澡还是晚上？',opts:['🌅 早上','🌙 晚上']},{q:'计划型还是随性型？',opts:['📋 计划','🎲 随性']},{q:'最喜欢的运动？',opts:['🏀 球类','🏊 游泳','🏃 跑步','🚴 骑行','😴 不运动']},{q:'最喜欢的宠物？',opts:['🐱 猫','🐶 狗','🐹 仓鼠','🐟 鱼','🚫 不养']},{q:'手机静音还是响铃？',opts:['🔇 静音','🔔 响铃','震动']},{q:'最喜欢的节日？',opts:['🎄 圣诞','🧧 春节','🎃 万圣','🎂 生日']},{q:'甜食还是咸食？',opts:['🍰 甜食','🍟 咸食','都爱']},{q:'最想拥有的超能力？',opts:['🛸 飞','⏰ 时间停止','🧠 读心','🫥 隐身']},{q:'理想的一天从什么开始？',opts:['🛌 睡到自然醒','🏃 运动','🍳 做早餐','📱 刷手机']},{q:'最喜欢的花？',opts:['🌹 玫瑰','🌻 向日葵','🌸 樱花','🌷 郁金香']},{q:'拍照还是被拍？',opts:['📸 拍照','🤳 被拍','都行']},{q:'最不能接受的食物？',opts:['🥒 苦瓜','🧅 洋葱','🫘 折耳根','🐸 奇怪肉类','没有']},{q:'如果中了一百万？',opts:['✈️ 旅游','🏠 买房','💰 存起来','🍽️ 吃大餐']},{q:'更看重朋友的什么？',opts:['🤝 真诚','😂 幽默','🧠 智慧','💪 可靠']},{q:'最怕什么动物？',opts:['🐍 蛇','🕷️ 蜘蛛','🪳 蟑螂','🐭 老鼠','都不怕']},{q:'面条还是米饭？',opts:['🍜 面条','🍚 米饭','都爱']},{q:'想穿越到哪个时代？',opts:['🏛️ 古代','🎷 民国','🚀 未来','😎 现在挺好']},{q:'最想学的新技能？',opts:['🎸 乐器','🍳 做饭','🗣️ 外语','💃 舞蹈','💻 编程']},{q:'收到什么礼物最开心？',opts:['💌 手工','💰 实用','🌸 花','🎁 惊喜']},{q:'钱和时间哪个更重要？',opts:['💰 钱','⏰ 时间']},{q:'相信一见钟情还是日久生情？',opts:['💘 一见钟情','⏳ 日久生情']},{q:'房间整洁还是随性？',opts:['✨ 整洁','🤷 随性']},{q:'喜欢单数还是双数？',opts:['1️⃣ 单数','2️⃣ 双数','没注意过']},{q:'最喜欢的冰淇淋口味？',opts:['🍫 巧克力','🍓 草莓','🍵 抹茶','🥛 香草']},{q:'你觉得运气还是努力重要？',opts:['🍀 运气','💪 努力','都重要']}];
const TRUTH=['最近一次感到开心的事？','最害怕失去什么？','有什么隐藏技能？','上一次哭是什么时候？','最想改掉的习惯？','做过最尴尬的事？','最让你感动的一件事？','回到过去最想改变什么？','觉得自己最大的优点？','上一次撒谎是什么时候？','有没有一直想做没做的事？','最珍贵的童年回忆？','有没有暗恋过谁？','上一次生气因为什么？','做过最疯狂的事？','最让你骄傲的一件事？','最想去但还没去的地方？','什么事能让你瞬间开心？','最讨厌别人对你做什么？','有没有后悔没做的事？','你觉得自己理性还是感性？','最想和谁互换一天人生？','一年后的自己什么样？','最想对现在的自己说什么？'];
const DARE=['模仿一种动物叫声','对视30秒不准笑','单脚站30秒','用方言说一段深情的话','做10个俯卧撑','闭眼让对方手指画眉毛','用三种声音说你好','即兴跳15秒舞','模仿三个表情包','讲一个冷笑话必须让对方笑','把我要减肥唱出来','用左手写对方名字','原地转10圈走直线','用rap介绍自己','唱一首儿歌带动作','闭眼猜对方伸了几根手指','边深蹲边背乘法口诀','用最嗲的声音说一段话','模仿对方三个习惯','给对方按摩肩膀30秒','摆最搞笑姿势定格10秒','学一种动物走路'];

// ==================== MQTT 连接 ====================
let client=null;
let connected=false;
const BROKER='wss://broker.emqx.io:8084/mqtt';

function connectMQTT(){
    return new Promise((resolve)=>{
        client=mqtt.connect(BROKER,{clientId:'cg_'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:10000,reconnectPeriod:3000});
        client.on('connect',()=>{connected=true;resolve(true);});
        client.on('error',()=>{connected=false;resolve(false);});
        client.on('close',()=>{connected=false;});
        setTimeout(()=>{if(!connected)resolve(false);},8000);
    });
}

// ==================== 状态 ====================
let roomCode=null;
let amHost=false;
let myRole=''; // 'host'|'guest'
let otherOnline=false;
let currentGame=null;
let quizState=null;
let tdState=null;
let myQuizAnswer=null;
let myRPSPick=null;

function pub(topic,data){if(client&&connected)client.publish('cpg/'+roomCode+'/'+topic,JSON.stringify(data));}

// ==================== 渲染 ====================
let r=function(h){document.getElementById('app').innerHTML=h;};

function showHome(){
    roomCode=null;amHost=false;otherOnline=false;currentGame=null;
    if(client){try{client.end();}catch(e){}}client=null;connected=false;
    r(`<div class="header"><div class="icon">🎮</div><h1>情侣小游戏</h1><p>选一个游戏，创建房间邀请TA~</p></div>
    <div class="game-cards">
        <div class="game-card" onclick="enterRoom('quiz')"><div class="gc-icon">💕</div><div class="gc-info"><div class="gc-name">默契大考验</div><div class="gc-desc">互相了解，测测默契度</div></div></div>
        <div class="game-card" onclick="enterRoom('truthdare')"><div class="gc-icon">🎲</div><div class="gc-info"><div class="gc-name">真心话大冒险</div><div class="gc-desc">猜拳定胜负，输的接受挑战</div></div></div>
    </div>`);
}

function enterRoom(gameType){
    currentGame=gameType;
    const gName=gameType==='quiz'?'默契大考验':'真心话大冒险';
    const gIcon=gameType==='quiz'?'💕':'🎲';
    r(`<div class="header"><div class="icon">${gIcon}</div><h1>${gName}</h1><p>创建房间，邀请TA一起玩~</p></div>
    <div class="card">
        <p class="mb-8" style="color:#9b8aad">两人各用自己手机操作</p>
        <button class="btn btn-primary btn-block" onclick="createRoom()">🏠 创建房间</button>
        <div class="mt-12" style="color:#b8a8cc;font-size:12px">— 或者 —</div>
        <input id="joinCode" placeholder="输入6位房间码" maxlength="6" autocomplete="off" style="width:100%;padding:11px;border:2px solid #e8ddf5;border-radius:14px;font-size:17px;text-align:center;font-weight:700;margin:8px 0;outline:none;letter-spacing:3px" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        <button class="btn btn-outline btn-block" onclick="joinRoom()">🚪 加入房间</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="showHome()">← 返回选游戏</button>
    </div>`);
}

async function createRoom(){
    roomCode=String(Math.floor(100000+Math.random()*900000));
    amHost=true;myRole='host';
    r(`<div class="header"><div class="icon">⏳</div><h1>连接中...</h1><p class="connecting">正在建立连接</p></div>`);
    const ok=await connectMQTT();
    if(!ok){showToast('连接失败，请检查网络后重试','error');showHome();return;}
    client.subscribe('cpg/'+roomCode+'/#');
    listenMQTT();
    pub('host_join',{id:myRole});
    showLobby();
}

async function joinRoom(){
    const input=document.getElementById('joinCode');
    roomCode=input.value.trim();
    if(roomCode.length!==6){showToast('请输入6位房间码','error');return;}
    amHost=false;myRole='guest';
    r(`<div class="header"><div class="icon">⏳</div><h1>连接中...</h1><p class="connecting">正在加入房间 ${roomCode}</p></div>`);
    const ok=await connectMQTT();
    if(!ok){showToast('连接失败，请检查网络后重试','error');showHome();return;}
    client.subscribe('cpg/'+roomCode+'/#');
    listenMQTT();
    pub('guest_join',{id:myRole});
    showLobby();
}

function listenMQTT(){
    client.on('message',(topic,msg)=>{
        try{
            const data=JSON.parse(msg.toString());
            const parts=topic.split('/');
            const action=parts[2];
            
            if(action==='guest_join'&&amHost){otherOnline=true;pub('host_join',{id:myRole});showLobby();}
            if(action==='host_join'&&!amHost){otherOnline=true;showLobby();}
            
            if(action==='start_game'){
                currentGame=data.game;
                if(data.game==='quiz'){quizState={idx:0,score:0,total:0,hAns:null,gAns:null,revealed:false};showQuizUI();}
                else{tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};showRPSUI();}
            }
            
            if(action==='quiz_answer'){
                if(!quizState)return;
                if(amHost)quizState.gAns=data.answer;else quizState.hAns=data.answer;
                if(quizState.hAns!=null&&quizState.gAns!=null&&!quizState.revealed){
                    quizState.revealed=true;
                    const matched=(amHost?quizState.hAns:quizState.gAns)===(amHost?quizState.gAns:quizState.hAns);
                    if(matched)quizState.score++;
                    quizState.total++;
                    showQuizReveal(matched);
                }
            }
            
            if(action==='quiz_skip'){
                if(!quizState)return;
                quizState.idx++;quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
                quizState.total++;
                myQuizAnswer=null;
                if(quizState.total>=10)showQuizEnd();else showQuizUI();
            }
            
            if(action==='rps_pick'){
                if(!tdState)return;
                if(amHost)tdState.gRps=data.pick;else tdState.hRps=data.pick;
                if(tdState.hRps!=null&&tdState.gRps!=null&&tdState.phase==='rps'){
                    resolveRPS();
                }
            }
            
            if(action==='td_choose'){
                if(!tdState)return;
                tdState.type=data.type;tdState.index=data.index;tdState.phase='show';
                showTDShow();
            }
            
            if(action==='td_next'){
                tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};
                myRPSPick=null;
                showRPSUI();
            }
            
            if(action==='td_redraw'){
                if(tdState)tdState.phase='choose';
                showTDChoose();
            }
            
            if(action==='back_lobby'){
                currentGame=null;quizState=null;tdState=null;myQuizAnswer=null;myRPSPick=null;
                showLobby();
            }
        }catch(e){}
    });
}

// ==================== 大厅 ====================
function showLobby(){
    const gName=currentGame==='quiz'?'默契大考验':'真心话大冒险';
    const gIcon=currentGame==='quiz'?'💕':'🎲';
    const myName=amHost?'玩家1':'玩家2';
    const otherName=amHost?'玩家2':'玩家1';
    r(`<div class="header"><div class="icon">${gIcon}</div><h1>${gName}</h1><p>房间 ${roomCode}</p>
        <p><span class="badge badge-me">${myName}（我）</span>
        ${otherOnline?`<span class="badge badge-other">${otherName} ✅</span>`:`<span class="badge badge-wait connecting">等待对方加入...</span>`}
        </p><div class="status-bar"><span class="dot ${connected?'dot-green':'dot-red'}"></span>${connected?'已连接':'连接中...'}</div></div>
        ${otherOnline?`<div class="card"><p class="mb-8" style="color:#9b8aad">双方都在了！</p>
            <button class="btn btn-primary btn-block" onclick="startGame()">🚀 开始游戏</button></div>`:
        `<div class="card"><p style="color:#b8a8cc">⏳ 等对方加入...</p><div class="room-code">${roomCode}</div>
            <button class="btn btn-sm btn-outline mt-8" onclick="copyCode()">📋 复制房间码</button></div>`}
        <button class="btn btn-sm btn-outline btn-block mt-12" onclick="leaveRoom()">🚪 离开房间</button>`);
}

function copyCode(){navigator.clipboard?.writeText(roomCode).then(()=>showToast('已复制！','success')).catch(()=>showToast('请手动记下房间码','info'));}

function startGame(){
    if(!otherOnline){showToast('等待对方加入~','info');return;}
    pub('start_game',{game:currentGame});
    if(currentGame==='quiz'){quizState={idx:0,score:0,total:0,hAns:null,gAns:null,revealed:false};myQuizAnswer=null;showQuizUI();}
    else{tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();}
}

function leaveRoom(){
    pub('back_lobby',{});
    if(client){try{client.end();}catch(e){}}client=null;connected=false;
    showHome();
}

// ==================== 默契大考验 ====================
function showQuizUI(){
    if(!quizState||quizState.total>=10){showQuizEnd();return;}
    const q=QUIZ[quizState.idx%QUIZ.length];
    const answered=myQuizAnswer!=null;
    r(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1><p>第${quizState.total+1}题 | 得分：${quizState.score} | 房间${roomCode}</p></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts">${q.opts.map((o,i)=>`<div class="quiz-opt ${answered?'locked':''}" onclick="pickQuiz(${i})" id="qo${i}">${o}</div>`).join('')}</div>
        <p style="color:#b8a8cc;font-size:11px;margin-top:6px">${answered?'✅ 已选，等对方...':'请选择你的答案'}</p>
        <button class="btn btn-sm btn-outline mt-8" onclick="skipQuiz()">🔄 换一题</button>
    </div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function pickQuiz(idx){
    if(myQuizAnswer!=null)return;
    myQuizAnswer=idx;
    document.querySelectorAll('.quiz-opt').forEach((b,i)=>{b.classList.add('locked');if(i===idx)b.classList.add('picked');});
    pub('quiz_answer',{answer:idx});
}

function showQuizReveal(matched){
    const q=QUIZ[quizState.idx%QUIZ.length];
    const myAns=amHost?quizState.hAns:quizState.gAns;
    const otherAns=amHost?quizState.gAns:quizState.hAns;
    setTimeout(()=>{
        quizState.idx++;quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
        myQuizAnswer=null;
        if(quizState.total>=10)showQuizEnd();else showQuizUI();
    },2000);
    r(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div style="display:flex;justify-content:center;gap:16px;margin:10px 0"><div style="text-align:center"><small>你</small><br><b>${q.opts[myAns]}</b></div><div style="color:#c8b8d8;align-self:center">VS</div><div style="text-align:center"><small>对方</small><br><b>${q.opts[otherAns]}</b></div></div>
        <div style="font-weight:700;font-size:15px;color:${matched?'#22c55e':'#ef4444'}">${matched?'🎉 默契！':'💔 不一样~'}</div></div>`);
}

function skipQuiz(){
    pub('quiz_skip',{});
    quizState.idx++;quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
    quizState.total++;myQuizAnswer=null;
    if(quizState.total>=10)showQuizEnd();else showQuizUI();
}

function showQuizEnd(){
    const pct=quizState.total>0?Math.round(quizState.score/quizState.total*100):0;
    r(`<div class="header"><div class="icon">🎉</div><h1>测试结束！</h1></div>
    <div class="card"><div style="font-size:44px;font-weight:900;color:#c44dff">${pct}%</div><p style="color:#9b8aad">答对 ${quizState.score}/${quizState.total} 题</p>
        <button class="btn btn-primary mt-8" onclick="startGame()">再来一次</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">返回房间</button></div>`);
}

// ==================== 真心话大冒险 ====================
function showRPSUI(){
    const locked=myRPSPick!=null?'locked':'';
    r(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1><p>猜拳定胜负 | 房间${roomCode}</p></div>
    <div class="card"><p class="mb-8" style="color:#9b8aad">双方同时出手！</p>
        <div class="rps-row"><button class="rps-btn ${locked}" onclick="pickRPS('✊')">✊</button><button class="rps-btn ${locked}" onclick="pickRPS('✋')">✋</button><button class="rps-btn ${locked}" onclick="pickRPS('✌️')">✌️</button></div>
        <p style="color:#b8a8cc;font-size:11px">${myRPSPick!=null?'✅ 已出，等对方...':'请出手！'}</p></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function pickRPS(hand){
    if(myRPSPick!=null)return;
    myRPSPick=hand;
    document.querySelectorAll('.rps-btn').forEach(b=>{b.classList.add('locked');if(b.textContent===hand)b.classList.add('picked')});
    pub('rps_pick',{pick:hand});
}

function resolveRPS(){
    const h=tdState.hRps,g=tdState.gRps;
    let result,loser;
    if(h===g){result='🤝 平局！';loser=null;}
    else if((h==='✊'&&g==='✌️')||(h==='✋'&&g==='✊')||(h==='✌️'&&g==='✋')){result='玩家1赢了！';loser='guest';}
    else{result='玩家2赢了！';loser='host';}
    tdState.result=result;tdState.loser=loser;
    if(loser){tdState.phase='choose';showTDChoose();}
    else{setTimeout(()=>{tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();},1500);}
    const myPick=amHost?h:g;
    const otherPick=amHost?g:h;
    r(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1></div>
    <div class="card">
        <div style="display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0"><div style="text-align:center"><div style="font-size:36px">${myPick}</div><small>你</small></div><div>VS</div><div style="text-align:center"><div style="font-size:36px">${otherPick}</div><small>对方</small></div></div>
        <p style="font-weight:700;font-size:16px">${result}</p></div>`);
}

function showTDChoose(){
    const iAmLoser=(tdState.loser==='host'&&amHost)||(tdState.loser==='guest'&&!amHost);
    if(iAmLoser){r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${tdState.result}</p><p style="color:#9b8aad" class="mb-8">你输了！选挑战：</p>
            <button class="btn btn-primary btn-block" onclick="chooseTD('truth')" style="background:linear-gradient(135deg,#ff4d6a,#ff6b9d)">🗣️ 真心话</button>
            <button class="btn btn-primary btn-block mt-8" onclick="chooseTD('dare')" style="background:linear-gradient(135deg,#4d6aff,#6b9dff)">⚡ 大冒险</button></div>`);}
    else{r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${tdState.result}</p><p style="color:#b8a8cc">⏳ 等对方选挑战...</p></div>`);}
}

function chooseTD(type){
    const pool=type==='truth'?TRUTH:DARE;
    const idx=Math.floor(Math.random()*pool.length);
    tdState.type=type;tdState.index=idx;
    pub('td_choose',{type,index:idx});
    showTDShow();
}

function showTDShow(){
    const pool=(tdState.type==='truth'?TRUTH:DARE);
    const content=pool[tdState.index]||pool[0];
    r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
    <div class="card"><div class="td-card"><div><span class="tag ${tdState.type==='truth'?'tag-truth':'tag-dare'}">${tdState.type==='truth'?'🗣️ 真心话':'⚡ 大冒险'}</span><div>${content}</div></div></div>
        <p style="color:#b8a8cc;font-size:11px">完成挑战后继续~</p>
        <button class="btn btn-primary mt-8" onclick="nextTD()">✅ 完成！继续</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="redrawTD()">🔄 换一个</button></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function nextTD(){pub('td_next',{});tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();}
function redrawTD(){pub('td_redraw',{});showTDChoose();}

// ==================== Toast ====================
function showToast(msg,type){
    const old=document.querySelector('.toast');if(old)old.remove();
    const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},2000);
}

// ==================== 爱心 ====================
(function(){
    const c=document.getElementById('heartsBg');
    const h=['💕','💖','💗','💝','💘','❤️','💓'];
    for(let i=0;i<14;i++){
        const s=document.createElement('span');s.className='heart-float';
        s.textContent=h[Math.floor(Math.random()*h.length)];
        s.style.left=Math.random()*95+'%';s.style.fontSize=(12+Math.random()*18)+'px';
        s.style.animationDuration=(8+Math.random()*14)+'s';s.style.animationDelay=Math.random()*10+'s';
        c.appendChild(s);
    }
})();

showHome();
</script>
</body>
</html>
