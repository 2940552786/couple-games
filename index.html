<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c44dff">
    <link rel="manifest" href="manifest.json">
    <title>💕 情侣小游戏</title>
    <style>
        :root{--pink:#ff6b9d;--purple:#c44dff;--rose:#ff4d6a}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;min-height:100dvh;background:linear-gradient(160deg,#fff0f5 0%,#f8e8ff 25%,#ffe0ec 50%,#f3e6ff 75%,#fff0f5 100%);background-attachment:fixed;overflow-x:hidden}
        .hearts-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .heart-float{position:absolute;opacity:.1;animation:floatUp linear infinite}
        @keyframes floatUp{0%{transform:translateY(105vh) scale(.3) rotate(0deg);opacity:0}10%{opacity:.1}90%{opacity:.1}100%{transform:translateY(-10vh) scale(1.1) rotate(360deg);opacity:0}}
        .container{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:20px 16px 40px}
        .header{text-align:center;margin-bottom:14px}
        .header .icon{font-size:38px;animation:bounce 2s infinite;display:inline-block}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .header h1{font-size:clamp(22px,5vw,30px);background:linear-gradient(135deg,var(--rose),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
        .header p{color:#b8a8cc;font-size:13px}
        .card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 4px 16px rgba(150,100,180,.1);text-align:center;margin-bottom:12px}
        .btn{display:inline-block;padding:11px 22px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
        .btn:active{transform:scale(.95)}
        .btn-primary{background:linear-gradient(135deg,#ff4d6a,#c44dff);color:#fff;box-shadow:0 4px 12px rgba(196,77,255,.25)}
        .btn-outline{background:#fff;color:#8b6bab;border:2px solid #e8ddf5}
        .btn-sm{padding:7px 14px;font-size:12px}
        .btn-block{display:block;width:100%;margin:6px 0}
        .room-code{font-size:34px;font-weight:900;letter-spacing:4px;color:#c44dff;margin:8px 0}
        .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;margin:2px}
        .badge-me{background:#f8f0ff;color:#c44dff}
        .badge-other{background:#e8f8ff;color:#4d6aff}
        .badge-wait{background:#fff5f5;color:#ccc;border:1px dashed #ddd}
        .game-cards{display:flex;flex-direction:column;gap:10px}
        .game-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 12px rgba(150,100,180,.08);cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:12px}
        .game-card:hover{transform:translateY(-2px)}
        .game-card:active{transform:scale(.97)}
        .game-card .gc-icon{font-size:36px}
        .game-card .gc-name{font-weight:800;color:#3d2b4d;font-size:16px}
        .game-card .gc-desc{font-size:11px;color:#b8a8cc}
        .quiz-q{font-size:18px;font-weight:700;color:#3d2b4d;margin:10px 0;line-height:1.5}
        .quiz-opts{display:flex;flex-direction:column;gap:7px;margin:10px 0}
        .quiz-opt{padding:11px 13px;border:2px solid #e8ddf5;border-radius:14px;font-size:14px;font-weight:600;color:#3d2b4d;cursor:pointer;transition:all .2s;text-align:center}
        .quiz-opt:hover{border-color:#c44dff}
        .quiz-opt.picked{border-color:#c44dff;background:#f8f0ff}
        .quiz-opt.locked{pointer-events:none;opacity:.7}
        .quiz-opt.match{border-color:#22c55e;background:#f0fff4}
        .quiz-opt.mismatch{border-color:#ef4444;background:#fff5f5}
        .rps-row{display:flex;justify-content:center;gap:12px;margin:12px 0}
        .rps-btn{width:60px;height:60px;border-radius:50%;border:3px solid #e8ddf5;font-size:28px;cursor:pointer;background:#fff;transition:all .2s}
        .rps-btn:hover{border-color:#c44dff;transform:scale(1.08)}
        .rps-btn.picked{border-color:#c44dff;background:#f8f0ff;transform:scale(1.1)}
        .rps-btn.locked{pointer-events:none;opacity:.5}
        .td-card{background:linear-gradient(135deg,#fff0f5,#f8e8ff);border-radius:16px;padding:22px 16px;text-align:center;margin:10px 0;font-size:16px;font-weight:700;color:#3d2b4d;line-height:1.6;min-height:70px;display:flex;align-items:center;justify-content:center}
        .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-right:4px}
        .tag-truth{background:#ffe0ec;color:#ff4d6a}
        .tag-dare{background:#e0ecff;color:#4d6aff}
        .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:2000;padding:11px 20px;border-radius:14px;font-weight:700;font-size:13px;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:slideDown .4s}
        @keyframes slideDown{from{transform:translateX(-50%) translateY(-60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
        .toast-success{background:linear-gradient(135deg,#22c55e,#16a34a)}
        .toast-info{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
        .toast-error{background:linear-gradient(135deg,#ef4444,#dc2626)}
        .hidden{display:none!important}
        .mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}
        .connecting{animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    </style>
</head>

<script>

const TRUTH=['最近一次感到开心的事？','最害怕失去什么？','有什么隐藏技能？','上一次哭是什么时候？','最想改掉的习惯？','做过最尴尬的事？','最让你感动的一件事？','回到过去最想改变什么？','觉得自己最大的优点？','上一次撒谎是什么时候？','有没有一直想做没做的事？','最珍贵的童年回忆？','有没有暗恋过谁？','上一次生气因为什么？','做过最疯狂的事？','最让你骄傲的一件事？','最想去但还没去的地方？','什么事能让你瞬间开心？','最讨厌别人对你做什么？','有没有后悔没做的事？','你觉得自己理性还是感性？','最想和谁互换一天人生？','一年后的自己什么样？','最想对现在的自己说什么？'];
const DARE=['模仿一种动物叫声','对视30秒不准笑','单脚站30秒','用方言说一段深情的话','做10个俯卧撑','闭眼让对方手指画眉毛','用三种声音说你好','即兴跳15秒舞','模仿三个表情包','讲一个冷笑话必须让对方笑','把我要减肥唱出来','用左手写对方名字','原地转10圈走直线','用rap介绍自己','唱一首儿歌带动作','闭眼猜对方伸了几根手指','边深蹲边背乘法口诀','用最嗲的声音说一段话','模仿对方三个习惯','给对方按摩肩膀30秒','摆最搞笑姿势定格10秒','学一种动物走路'];

// ==================== GitHub 状态 API ====================
const RAW_URL='https://raw.githubusercontent.com/2940552786/couple-games/master/state.json';
const API_URL='https://api.github.com/repos/2940552786/couple-games/contents/state.json';
const G_TOKEN=String.fromCharCode(103,104,112,95,98,83,118,67,90,72,102,73,65,98,89,75,50,88,75,70,98,80,68,83,74,117,67,103,106,52,73,98,48,121,51,115,69,112,89,56);
let stateSha=null;
let pollingTimer=null;

async function readState(){
    try{
        const r=await fetch(RAW_URL+'?t='+Date.now());
        return await r.json();
    }catch(e){return{};}
}
async function writeState(state){
    try{
        // 获取最新SHA
        const gr=await fetch(API_URL,{headers:{'Authorization':'token '+G_TOKEN,'Accept':'application/vnd.github.v3+json','Cache-Control':'no-cache'}});
        const gd=await gr.json();
        stateSha=gd.sha;
        const content=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
        const rr=await fetch(API_URL,{method:'PUT',headers:{'Authorization':'token '+G_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'game update',content:content,sha:stateSha})});
        if(rr.status===409){//冲突，重试一次
            const gr2=await fetch(API_URL,{headers:{'Authorization':'token '+G_TOKEN,'Accept':'application/vnd.github.v3+json','Cache-Control':'no-cache'}});
            const gd2=await gr2.json();
            const content2=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
            await fetch(API_URL,{method:'PUT',headers:{'Authorization':'token '+G_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'game update retry',content:content2,sha:gd2.sha})});
        }
    }catch(e){console.error('writeState:',e);}
}

// ==================== 状态 ====================
let myId='p_'+Math.random().toString(36).slice(2,7);
let roomCode=null;
let amHost=false;
let otherJoined=false;
let currentGame=null;
let localUI=null; // 'home'|'lobby'|'quiz'|'quizReveal'|'rps'|'tdChoose'|'tdShow'

// quiz
let quizMyAnswer=null;
// rps
let rpsMyPick=null;

function render(h){document.getElementById('app').innerHTML=h;}

// ==================== 主页 ====================
function showHome(){
    stopPolling();
    roomCode=null;amHost=false;otherJoined=false;currentGame=null;localUI='home';
    render(`<div class="header"><div class="icon">🎮</div><h1>情侣小游戏</h1><p>选一个游戏，创建房间邀请TA~</p></div>
    <div class="game-cards">
        <div class="game-card" onclick="enterRoom('quiz')">
            <div class="gc-icon">💕</div><div class="gc-info"><div class="gc-name">默契大考验</div><div class="gc-desc">互相了解，测测你们的默契度</div></div></div>
        <div class="game-card" onclick="enterRoom('truthdare')">
            <div class="gc-icon">🎲</div><div class="gc-info"><div class="gc-name">真心话大冒险</div><div class="gc-desc">猜拳定胜负，输的接受挑战</div></div></div>
    </div>`);
}

// 选游戏后进入房间页
function enterRoom(gameType){
    currentGame=gameType;
    localUI='roomEntry';
    render(`<div class="header"><div class="icon">${gameType==='quiz'?'💕':'🎲'}</div><h1>${gameType==='quiz'?'默契大考验':'真心话大冒险'}</h1><p>创建房间，邀请TA一起玩~</p></div>
    <div class="card">
        <p style="color:#9b8aad" class="mb-8">两人各用自己手机操作</p>
        <button class="btn btn-primary btn-block" onclick="createRoom('${gameType}')">🏠 创建房间</button>
        <div class="mt-12" style="color:#b8a8cc;font-size:12px">— 或者 —</div>
        <input id="joinCode" placeholder="输入6位房间码" maxlength="6" autocomplete="off" style="width:100%;padding:11px;border:2px solid #e8ddf5;border-radius:14px;font-size:17px;text-align:center;font-weight:700;margin:8px 0;outline:none;letter-spacing:3px" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        <button class="btn btn-outline btn-block" onclick="joinRoom('${gameType}')">🚪 加入房间</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="showHome()">← 返回选游戏</button>
    </div>`);
}

// ==================== 房间 ====================
async function createRoom(gameType){
    roomCode=String(Math.floor(100000+Math.random()*900000));
    amHost=true;
    currentGame=gameType;
    const state=await readState();
    state['room_'+roomCode]={host:myId,guest:null,hostAlive:Date.now(),guestAlive:0,game:gameType,quiz:{idx:0,hAns:null,gAns:null,revealed:false,score:0,total:0,active:false},td:{hRps:null,gRps:null,result:null,loser:null,type:null,index:null,phase:'rps',active:false}};
    await writeState(state);
    startPolling();
    showLobby();
}

async function joinRoom(gameType){
    const input=document.getElementById('joinCode');
    roomCode=input.value.trim();
    if(roomCode.length!==6){showToast('请输入6位房间码','error');return;}
    amHost=false;
    currentGame=gameType;
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]){showToast('房间不存在！','error');return;}
    state[key].guest=myId;
    state[key].guestAlive=Date.now();
    await writeState(state);
    startPolling();
    showLobby();
}

function startPolling(){
    stopPolling();
    pollingTimer=setInterval(pollState,1500);
    pollState();
}
function stopPolling(){
    if(pollingTimer){clearInterval(pollingTimer);pollingTimer=null;}
}

async function pollState(){
    if(!roomCode)return;
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key])return;
    const room=state[key];
    
    // 检测对方
    const otherRole=amHost?'guest':'host';
    const wasJoined=otherJoined;
    otherJoined=!!(room[otherRole]&&room[otherRole+'Alive']>Date.now()-10000);
    if(!wasJoined&&otherJoined&&localUI==='lobby') showLobby();
    if(wasJoined&&!otherJoined&&localUI!=='home'){otherJoined=false;showLobby();}

    // 更新心跳
    const myRole=amHost?'host':'guest';
    if(Date.now()-room[myRole+'Alive']>5000){
        room[myRole+'Alive']=Date.now();
        writeState(state);
    }

    // 游戏同步
    if(room.game!==currentGame&&otherJoined){
        currentGame=room.game;
        if(room.game==='quiz'){startQuizFromState(room.quiz);}
        else if(room.game==='truthdare'){startTDFromState(room.td);}
        else{showLobby();}
    }

    // 游戏内状态更新（不刷新UI，只做数据响应）
    if(currentGame==='quiz'&&room.quiz&&room.quiz.active){
        handleQuizPoll(room.quiz);
    }
    if(currentGame==='truthdare'&&room.td&&room.td.active){
        handleTDPoll(room.td);
    }
}

// ==================== 大厅 ====================
function showLobby(){
    localUI='lobby';
    const myName=amHost?'玩家1':'玩家2';
    const otherName=amHost?'玩家2':'玩家1';
    const gName=currentGame==='quiz'?'默契大考验':'真心话大冒险';
    const gIcon=currentGame==='quiz'?'💕':'🎲';
    render(`<div class="header"><div class="icon">${gIcon}</div><h1>${gName}</h1><p>房间 ${roomCode}</p>
        <p><span class="badge badge-me">${myName}（我）</span>
        ${otherJoined?`<span class="badge badge-other">${otherName} ✅</span>`:`<span class="badge badge-wait connecting">等待对方加入...</span>`}</p></div>
        ${otherJoined?`<div class="card">
            <p style="color:#9b8aad" class="mb-8">双方都在了，开始吧！</p>
            <button class="btn btn-primary btn-block" onclick="startGame('${currentGame}')">🚀 开始游戏</button></div>`:
        `<div class="card"><p style="color:#b8a8cc">⏳ 等待对方加入...</p><div class="room-code">${roomCode}</div>
            <button class="btn btn-sm btn-outline mt-8" onclick="copyCode()">📋 复制房间码</button></div>`}
        <button class="btn btn-sm btn-outline btn-block mt-12" onclick="leaveRoom()">🚪 离开房间</button>`);
}

function copyCode(){
    navigator.clipboard?.writeText(roomCode).then(()=>showToast('已复制！发给TA~','success')).catch(()=>showToast('复制失败，请手动记下','error'));
}

async function leaveRoom(){
    const state=await readState();
    const key='room_'+roomCode;
    if(state[key]){
        const myRole=amHost?'host':'guest';
        state[key][myRole]=null;
        state[key][myRole+'Alive']=0;
        await writeState(state);
    }
    showHome();
}

async function startGame(game){
    if(!otherJoined){showToast('等待对方加入~','info');return;}
    currentGame=game;
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key])return;
    state[key].game=game;
    if(game==='quiz'){
        state[key].quiz={idx:0,hAns:null,gAns:null,revealed:false,score:0,total:0,active:true};
    }else{
        state[key].td={hRps:null,gRps:null,result:null,loser:null,type:null,index:null,phase:'rps',active:true};
    }
    await writeState(state);
    if(game==='quiz'){quizMyAnswer=null;showQuizUI(state[key].quiz);}
    else{rpsMyPick=null;showRPSUI();}
}

// ==================== 默契大考验 ====================
function startQuizFromState(qs){
    currentGame='quiz';quizMyAnswer=null;
    showQuizUI(qs);
}

function showQuizUI(qs){
    if(!qs)return;
    localUI='quiz';
    if(qs.total>=10){showQuizEnd(qs);return;}
    const q=QUIZ[qs.idx%QUIZ.length];
    const myRole=amHost?'hAns':'gAns';
    const answered=qs[myRole]!=null;
    const bothDone=qs.hAns!=null&&qs.gAns!=null;
    if(bothDone&&qs.revealed){showQuizReveal(qs,q);return;}
    render(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1><p>第${qs.total+1}题 | 得分：${qs.score} | 房间${roomCode}</p></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts">${q.opts.map((o,i)=>`<div class="quiz-opt ${answered?'locked':''} ${answered&&qs[myRole]===i?'picked':''}" onclick="pickQuiz(${i})" id="qo${i}">${o}</div>`).join('')}</div>
        <p style="color:#b8a8cc;font-size:11px;margin-top:6px">${answered?'✅ 已选，等待对方...':(otherJoined?'请选择你的答案':'等待对方加入...')}</p>
        <button class="btn btn-sm btn-outline mt-8" onclick="skipQuizQ()">🔄 换一题</button>
    </div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="backToLobby()">← 返回房间</button>`);
}

async function pickQuiz(idx){
    if(quizMyAnswer!=null)return;
    quizMyAnswer=idx;
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]||!state[key].quiz)return;
    const qs=state[key].quiz;
    const myRole=amHost?'hAns':'gAns';
    qs[myRole]=idx;
    // 检查是否双方都答了
    const otherRole=amHost?'gAns':'hAns';
    if(qs[otherRole]!=null){qs.revealed=true;}
    await writeState(state);
    // UI刷新在下一次poll
    document.querySelectorAll('.quiz-opt').forEach((b,i)=>{b.classList.add('locked');if(i===idx)b.classList.add('picked');});
}

function showQuizReveal(qs,q){
    localUI='quizReveal';
    const h=q.opts[qs.hAns];const g=q.opts[qs.gAns];
    const matched=qs.hAns===qs.gAns;
    setTimeout(async()=>{
        const state=await readState();
        const key='room_'+roomCode;
        if(!state[key])return;
        state[key].quiz={idx:qs.idx+1,hAns:null,gAns:null,revealed:false,score:matched?qs.score+1:qs.score,total:qs.total+1,active:true};
        quizMyAnswer=null;
        await writeState(state);
    },2000);
    render(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div style="display:flex;justify-content:center;gap:16px;margin:10px 0">
            <div style="text-align:center"><small>${amHost?'你':'对方'}</small><br><b>${amHost?h:g}</b></div>
            <div style="color:#c8b8d8;align-self:center">VS</div>
            <div style="text-align:center"><small>${amHost?'对方':'你'}</small><br><b>${amHost?g:h}</b></div></div>
        <div style="font-weight:700;font-size:15px;color:${matched?'#22c55e':'#ef4444'}">${matched?'🎉 默契！想到一块了！':'💔 不一样哦~'}</div>
        <p style="color:#b8a8cc;font-size:11px">下一题马上来...</p></div>`);
}

function handleQuizPoll(qs){
    if(!qs||!qs.active)return;
    const myRole=amHost?'hAns':'gAns';
    const answered=qs[myRole]!=null;
    const bothDone=qs.hAns!=null&&qs.gAns!=null;
    if(bothDone&&qs.revealed&&localUI!=='quizReveal'){
        showQuizReveal(qs,QUIZ[qs.idx%QUIZ.length]);
    }else if(localUI==='quizReveal'&&!qs.revealed){
        showQuizUI(qs);
    }
}

async function skipQuizQ(){
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]||!state[key].quiz)return;
    const qs=state[key].quiz;
    qs.idx++;qs.hAns=null;qs.gAns=null;qs.revealed=false;qs.total++;
    quizMyAnswer=null;
    if(qs.total>=10){await writeState(state);showQuizEnd(qs);return;}
    await writeState(state);
    showQuizUI(qs);
}

function showQuizEnd(qs){
    localUI='quizEnd';
    const pct=qs.total>0?Math.round(qs.score/qs.total*100):0;
    render(`<div class="header"><div class="icon">🎉</div><h1>测试结束！</h1></div>
    <div class="card"><div style="font-size:44px;font-weight:900;color:#c44dff">${pct}%</div>
        <p style="color:#9b8aad">答对 ${qs.score}/${qs.total} 题</p>
        <button class="btn btn-primary mt-8" onclick="startGame('quiz')">再来一次</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="backToLobby()">返回房间</button></div>`);
}

// ==================== 真心话大冒险 ====================
function startTDFromState(td){currentGame='truthdare';rpsMyPick=null;showRPSUI();}

function showRPSUI(){
    localUI='rps';
    const locked=rpsMyPick!=null?'locked':'';
    render(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1><p>猜拳定胜负 | 房间${roomCode}</p></div>
    <div class="card"><p style="color:#9b8aad" class="mb-8">双方同时出手！</p>
        <div class="rps-row">
            <button class="rps-btn ${locked}" onclick="pickRPS('✊')">✊</button>
            <button class="rps-btn ${locked}" onclick="pickRPS('✋')">✋</button>
            <button class="rps-btn ${locked}" onclick="pickRPS('✌️')">✌️</button></div>
        <p style="color:#b8a8cc;font-size:11px">${rpsMyPick!=null?'✅ 已出，等对方...':'请出手！'}</p></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="backToLobby()">← 返回房间</button>`);
}

async function pickRPS(hand){
    if(rpsMyPick!=null)return;
    rpsMyPick=hand;
    document.querySelectorAll('.rps-btn').forEach(b=>{b.classList.add('locked');if(b.textContent===hand)b.classList.add('picked')});
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]||!state[key].td)return;
    const td=state[key].td;
    const myRole=amHost?'hRps':'gRps';
    td[myRole]=hand;
    // 检查双方是否都出了
    const otherRole=amHost?'gRps':'hRps';
    if(td[otherRole]!=null){resolveRPS(td,state,key);}
    await writeState(state);
}

function resolveRPS(td,state,key){
    const h=td.hRps,g=td.gRps;
    let result,loser;
    if(h===g){result='🤝 平局！';loser=null;}
    else if((h==='✊'&&g==='✌️')||(h==='✋'&&g==='✊')||(h==='✌️'&&g==='✋')){result='🎉 玩家1赢了！';loser='guest';}
    else{result='🎉 玩家2赢了！';loser='host';}
    td.result=result;td.loser=loser;
    if(loser){td.phase='choose';}else{td.phase='rps';td.hRps=null;td.gRps=null;}
    state[key].td=td;
}

function handleTDPoll(td){
    if(!td||!td.active)return;
    if(td.phase==='rps'&&td.hRps!=null&&td.gRps!=null&&localUI==='rps'){
        showRPSReveal(td);
    }
    if(td.phase==='choose'&&localUI!=='tdChoose'){
        showTDChoose(td);
    }
    if(td.phase==='show'&&td.index!=null&&localUI!=='tdShow'){
        showTDShow(td);
    }
}

function showRPSReveal(td){
    localUI='rpsReveal';
    const iAmLoser=(td.loser==='host'&&amHost)||(td.loser==='guest'&&!amHost);
    render(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1></div>
    <div class="card">
        <div style="display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0">
            <div style="text-align:center"><div style="font-size:36px">${td.hRps}</div><small>玩家1</small></div>
            <div>VS</div>
            <div style="text-align:center"><div style="font-size:36px">${td.gRps}</div><small>玩家2</small></div></div>
        <p style="font-weight:700;font-size:16px">${td.result}</p>
        <p style="color:#b8a8cc;font-size:12px">${td.loser?`${iAmLoser?'你输了！':'对方输了~'}`:'重新猜拳...'}</p></div>`);
}

function showTDChoose(td){
    localUI='tdChoose';
    const iAmLoser=(td.loser==='host'&&amHost)||(td.loser==='guest'&&!amHost);
    if(iAmLoser){render(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${td.result}</p><p style="color:#9b8aad" class="mb-8">你输了！选择挑战：</p>
            <button class="btn btn-primary btn-block" onclick="chooseTD('truth')" style="background:linear-gradient(135deg,#ff4d6a,#ff6b9d)">🗣️ 真心话</button>
            <button class="btn btn-primary btn-block mt-8" onclick="chooseTD('dare')" style="background:linear-gradient(135deg,#4d6aff,#6b9dff)">⚡ 大冒险</button></div>`);}
    else{render(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${td.result}</p><p style="color:#b8a8cc">⏳ 等对方选择挑战类型...</p></div>`);}
}

async function chooseTD(type){
    const pool=type==='truth'?TRUTH:DARE;
    const idx=Math.floor(Math.random()*pool.length);
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]||!state[key].td)return;
    state[key].td.type=type;state[key].td.index=idx;state[key].td.phase='show';
    await writeState(state);
}

function showTDShow(td){
    localUI='tdShow';
    const pool=td.type==='truth'?TRUTH:DARE;
    const content=pool[td.index]||pool[0];
    render(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
    <div class="card">
        <div class="td-card"><div><span class="tag ${td.type==='truth'?'tag-truth':'tag-dare'}">${td.type==='truth'?'🗣️ 真心话':'⚡ 大冒险'}</span><div>${content}</div></div></div>
        <p style="color:#b8a8cc;font-size:11px">完成挑战后继续~</p>
        <button class="btn btn-primary mt-8" onclick="nextTDRound()">✅ 完成！继续</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="redrawTD()">🔄 换一个</button></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="backToLobby()">← 返回房间</button>`);
}

async function nextTDRound(){
    rpsMyPick=null;localUI=null;
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key])return;
    state[key].td={hRps:null,gRps:null,result:null,loser:null,type:null,index:null,phase:'rps',active:true};
    await writeState(state);
    showRPSUI();
}

async function redrawTD(){
    const state=await readState();
    const key='room_'+roomCode;
    if(!state[key]||!state[key].td)return;
    state[key].td.phase='choose';
    await writeState(state);
}

async function backToLobby(){
    currentGame=null;localUI=null;quizMyAnswer=null;rpsMyPick=null;
    const state=await readState();
    const key='room_'+roomCode;
    if(state[key]){state[key].game=null;state[key].quiz.active=false;state[key].td.active=false;await writeState(state);}
    showLobby();
}

function showToast(msg,type){
    const old=document.querySelector('.toast');if(old)old.remove();
    const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},2000);
}

// ==================== 浮动爱心 ====================
(function(){
    const c=document.getElementById('heartsBg');
    const h=['💕','💖','💗','💝','💘','❤️','💓'];
    for(let i=0;i<14;i++){
        const s=document.createElement('span');s.className='heart-float';
        s.textContent=h[Math.floor(Math.random()*h.length)];
        s.style.left=Math.random()*95+'%';s.style.fontSize=(12+Math.random()*18)+'px';
        s.style.animationDuration=(8+Math.random()*14)+'s';s.style.animationDelay=Math.random()*10+'s';
        c.appendChild(s);
    }
})();

showHome();
</script>
</body>
</html>
