<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c44dff">
    <link rel="manifest" href="manifest.json">
    <title>💕 情侣小游戏</title>
    <style>
        :root { --pink:#ff6b9d; --purple:#c44dff; --rose:#ff4d6a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            min-height:100vh; min-height:100dvh;
            background:linear-gradient(160deg,#fff0f5 0%,#f8e8ff 25%,#ffe0ec 50%,#f3e6ff 75%,#fff0f5 100%);
            background-attachment:fixed; overflow-x:hidden;
        }
        .hearts-bg { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
        .heart-float { position:absolute;opacity:.1;animation:floatUp linear infinite; }
        @keyframes floatUp {
            0%{transform:translateY(105vh) scale(.3) rotate(0deg);opacity:0}
            10%{opacity:.1} 90%{opacity:.1}
            100%{transform:translateY(-10vh) scale(1.1) rotate(360deg);opacity:0}
        }
        .container { position:relative;z-index:1;max-width:500px;margin:0 auto;padding:20px 16px 40px; }
        /* 头部 */
        .header { text-align:center;margin-bottom:18px; }
        .header .icon { font-size:42px;animation:bounce 2s infinite;display:inline-block; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .header h1 { font-size:clamp(24px,5vw,32px); background:linear-gradient(135deg,var(--rose),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900;letter-spacing:2px; }
        .header p { color:#b8a8cc;font-size:13px;margin-top:2px; }

        /* 主页卡片 */
        .game-cards { display:flex;flex-direction:column;gap:16px; }
        .game-card {
            background:#fff;border-radius:20px;padding:24px 20px;
            box-shadow:0 4px 16px rgba(150,100,180,.1);cursor:pointer;
            transition:transform .3s,box-shadow .3s;display:flex;align-items:center;gap:16px;
            -webkit-tap-highlight-color:transparent;
        }
        .game-card:hover { transform:translateY(-3px);box-shadow:0 8px 24px rgba(150,100,180,.18); }
        .game-card:active { transform:scale(.97); }
        .game-card .gc-icon { font-size:44px;flex-shrink:0; }
        .game-card .gc-info { flex:1; }
        .game-card .gc-name { font-size:19px;font-weight:800;color:#3d2b4d; }
        .game-card .gc-desc { font-size:12px;color:#b8a8cc;margin-top:2px; }
        .game-card .gc-arrow { font-size:20px;color:#d0c0e0; }

        /* 游戏页面 */
        .game-page { display:none; }
        .game-page.active { display:block;animation:fadeIn .3s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .back-btn {
            display:inline-flex;align-items:center;gap:4px;padding:8px 16px;
            border:none;background:rgba(255,255,255,.7);border-radius:20px;
            font-size:14px;color:#8b6bab;cursor:pointer;margin-bottom:14px;
            -webkit-tap-highlight-color:transparent;
        }
        .back-btn:active { background:rgba(255,255,255,.95); }

        /* 通用卡片样式 */
        .card {
            background:#fff;border-radius:20px;padding:24px 20px;
            box-shadow:0 4px 16px rgba(150,100,180,.1);text-align:center;
        }
        .btn {
            display:inline-block;padding:12px 24px;border-radius:14px;border:none;
            font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;
            letter-spacing:1px;-webkit-tap-highlight-color:transparent;
        }
        .btn:active { transform:scale(.95); }
        .btn-primary { background:linear-gradient(135deg,#ff4d6a,#c44dff);color:#fff;box-shadow:0 4px 12px rgba(196,77,255,.25); }
        .btn-outline { background:#fff;color:#8b6bab;border:2px solid #e8ddf5; }
        .btn-sm { padding:8px 16px;font-size:13px; }

        /* 默契大考验 */
        .quiz-question {
            font-size:20px;font-weight:700;color:#3d2b4d;margin:16px 0;line-height:1.6;
        }
        .quiz-options { display:flex;flex-direction:column;gap:10px;margin:16px 0; }
        .quiz-opt {
            padding:14px 16px;border:2px solid #e8ddf5;border-radius:14px;
            font-size:16px;font-weight:600;color:#3d2b4d;cursor:pointer;
            transition:all .2s;text-align:center;-webkit-tap-highlight-color:transparent;
            position:relative;overflow:hidden;
        }
        .quiz-opt:hover { border-color:#c44dff; }
        .quiz-opt.picked { border-color:#c44dff;background:#f8f0ff; }
        .quiz-opt.matched { border-color:#22c55e;background:#f0fff4; }
        .quiz-opt.mismatched { border-color:#ef4444;background:#fff5f5; }
        .quiz-score { font-size:28px;font-weight:900;color:#c44dff;margin:8px 0; }
        .quiz-progress { font-size:13px;color:#b8a8cc;margin-bottom:8px; }

        /* 猜拳 */
        .rps-area { margin:20px 0; }
        .rps-buttons { display:flex;justify-content:center;gap:16px;margin:16px 0; }
        .rps-btn {
            width:70px;height:70px;border-radius:50%;border:3px solid #e8ddf5;
            font-size:32px;cursor:pointer;background:#fff;transition:all .2s;
            -webkit-tap-highlight-color:transparent;
        }
        .rps-btn:hover { border-color:#c44dff;transform:scale(1.1); }
        .rps-btn.selected { border-color:#c44dff;background:#f8f0ff;transform:scale(1.15); }
        .rps-result { font-size:18px;font-weight:700;margin:12px 0; }
        .rps-vs { display:flex;justify-content:center;align-items:center;gap:20px;font-size:24px;font-weight:700;margin:16px 0; }
        .rps-vs .vs-emoji { font-size:48px; }

        /* 真心话大冒险卡片 */
        .truth-dare-card {
            background:linear-gradient(135deg,#fff0f5,#f8e8ff);border-radius:18px;
            padding:28px 20px;text-align:center;margin:16px 0;
            min-height:120px;display:flex;align-items:center;justify-content:center;
            font-size:18px;font-weight:700;color:#3d2b4d;line-height:1.6;
            animation:cardFlip .4s ease;
        }
        @keyframes cardFlip {
            0%{transform:rotateY(90deg);opacity:0}
            100%{transform:rotateY(0);opacity:1}
        }
        .td-label {
            display:inline-block;padding:4px 12px;border-radius:10px;
            font-size:12px;font-weight:700;margin-bottom:8px;
        }
        .td-truth { background:#ffe0ec;color:#ff4d6a; }
        .td-dare { background:#e0ecff;color:#4d6aff; }
        .td-actions { display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px; }

        /* Toast */
        .toast {
            position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:2000;
            padding:12px 22px;border-radius:16px;font-weight:700;font-size:14px;color:#fff;
            box-shadow:0 6px 20px rgba(0,0,0,.18);animation:slideDown .4s;
        }
        @keyframes slideDown { from{transform:translateX(-50%) translateY(-60px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        .toast-success { background:linear-gradient(135deg,#22c55e,#16a34a); }
        .toast-info { background:linear-gradient(135deg,#8b5cf6,#7c3aed); }

        .hidden { display:none !important; }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <!-- ========== 主页 ========== -->
        <div id="homePage">
            <div class="header">
                <div class="icon">🎮</div>
                <h1>情侣小游戏</h1>
                <p>增进了解的 2 款小游戏~</p>
            </div>
            <div class="game-cards">
                <div class="game-card" onclick="openGame('quiz')">
                    <div class="gc-icon">💕</div>
                    <div class="gc-info">
                        <div class="gc-name">默契大考验</div>
                        <div class="gc-desc">互相了解，测测你们的默契度</div>
                    </div>
                    <div class="gc-arrow">›</div>
                </div>
                <div class="game-card" onclick="openGame('truthdare')">
                    <div class="gc-icon">🎲</div>
                    <div class="gc-info">
                        <div class="gc-name">真心话大冒险</div>
                        <div class="gc-desc">猜拳定胜负，输的接受挑战</div>
                    </div>
                    <div class="gc-arrow">›</div>
                </div>
            </div>
        </div>

        <!-- ========== 游戏1：默契大考验 ========== -->
        <div class="game-page" id="quizPage">
            <button class="back-btn" onclick="goHome()">← 返回</button>
            <div class="card">
                <div style="font-size:36px;">💕</div>
                <h2 style="color:#3d2b4d;margin:8px 0;">默契大考验</h2>
                <div class="quiz-progress" id="quizProgress">第 1 题 | 得分：0</div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div id="quizOptions"></div>
                <div class="td-actions">
                    <button class="btn btn-sm btn-outline" onclick="skipQuiz()">🔄 换一题</button>
                    <button class="btn btn-sm btn-outline" onclick="revealQuiz()" id="btnReveal">👀 揭晓答案</button>
                    <button class="btn btn-sm btn-outline hidden" id="btnNextQuiz" onclick="nextQuiz()">下一题 →</button>
                </div>
                <div id="quizResult" style="margin-top:12px;font-weight:700;font-size:16px;"></div>
            </div>
            <!-- 结束面板 -->
            <div class="card hidden" id="quizEndCard" style="margin-top:16px;">
                <div style="font-size:48px;">🎉</div>
                <h2 style="color:#c44dff;">测试结束！</h2>
                <div class="quiz-score" id="quizFinalScore">0%</div>
                <p style="color:#9b8aad;">你们答对了 <span id="quizCorrect">0</span> / <span id="quizTotal">0</span> 题</p>
                <br>
                <button class="btn btn-primary" onclick="resetQuiz()">再来一次</button>
            </div>
        </div>

        <!-- ========== 游戏2：真心话大冒险 ========== -->
        <div class="game-page" id="truthdarePage">
            <button class="back-btn" onclick="goHome()">← 返回</button>
            <div class="card">
                <div style="font-size:36px;">✊</div>
                <h2 style="color:#3d2b4d;margin:8px 0;">先猜拳！</h2>
                <p style="color:#b8a8cc;font-size:13px;">双方同时出手，输的人接受挑战</p>
                <div class="rps-buttons" id="rpsButtons">
                    <button class="rps-btn" onclick="pickRPS('✊','A')" id="rpsA">✊</button>
                    <button class="rps-btn" onclick="pickRPS('✋','A')" id="rpsB">✋</button>
                    <button class="rps-btn" onclick="pickRPS('✌️','A')" id="rpsC">✌️</button>
                </div>
                <p style="color:#b8a8cc;font-size:12px;">👈 左边的人选择</p>
                <div class="rps-vs hidden" id="rpsShowArea">
                    <div><div style="font-size:36px;" id="rpsPlayer1"></div><small>左边</small></div>
                    <div style="color:#c8b8d8;">VS</div>
                    <div><div style="font-size:36px;" id="rpsPlayer2"></div><small>右边</small></div>
                </div>
                <div class="rps-result" id="rpsResultText"></div>
                <div class="hidden" id="rpsNextArea">
                    <button class="btn btn-sm btn-outline" onclick="resetRPS()">🔄 重新猜拳</button>
                </div>
                <div style="margin-top:8px;font-size:12px;color:#c8b8d8;">右边的人选→</div>
                <div class="rps-buttons">
                    <button class="rps-btn" onclick="pickRPS('✊','B')">✊</button>
                    <button class="rps-btn" onclick="pickRPS('✋','B')">✋</button>
                    <button class="rps-btn" onclick="pickRPS('✌️','B')">✌️</button>
                </div>
            </div>
            <!-- 选真心话/大冒险 -->
            <div class="card hidden" id="tdChooseCard" style="margin-top:14px;">
                <div class="rps-result" id="tdLoserText"></div>
                <p style="color:#9b8aad;margin-bottom:10px;">选择挑战类型：</p>
                <div class="td-actions">
                    <button class="btn btn-primary" onclick="drawTD('truth')" style="background:linear-gradient(135deg,#ff4d6a,#ff6b9d);">🗣️ 真心话</button>
                    <button class="btn btn-primary" onclick="drawTD('dare')" style="background:linear-gradient(135deg,#4d6aff,#6b9dff);">⚡ 大冒险</button>
                </div>
            </div>
            <!-- 题目显示 -->
            <div class="card hidden" id="tdCard" style="margin-top:14px;">
                <div class="truth-dare-card" id="tdContent"></div>
                <div class="td-actions">
                    <button class="btn btn-sm btn-outline" onclick="drawTD(currentTDType)">🔄 换一个</button>
                    <button class="btn btn-sm btn-primary" onclick="finishTD()">✅ 完成！</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 题库 ====================
        const quizQuestions = [
            { q:'喜欢猫还是狗？', opts:['🐱 猫','🐶 狗','都喜欢','都不喜欢'] },
            { q:'最喜欢的颜色？', opts:['🔴 红/粉','🔵 蓝/紫','🟢 绿','🟡 黄/橙','⚫ 黑/白'] },
            { q:'咖啡还是奶茶？', opts:['☕ 咖啡','🧋 奶茶','都不喝'] },
            { q:'早起鸟还是夜猫子？', opts:['🌅 早起','🌙 夜猫','看情况'] },
            { q:'喜欢夏天还是冬天？', opts:['☀️ 夏天','❄️ 冬天','春秋'] },
            { q:'更喜欢海边还是山？', opts:['🌊 海边','⛰️ 山里','都喜欢'] },
            { q:'火锅必点的三样之一？', opts:['🥩 肉','🥬 蔬菜','🍜 主食','🫕 丸子'] },
            { q:'下雨天最喜欢做什么？', opts:['📖 看书追剧','😴 睡觉','🍜 吃火锅','🎧 听音乐'] },
            { q:'最想去旅行的地方？', opts:['🗼 日本','🏝️ 海岛','🏔️ 雪山','🏛️ 欧洲','🏜️ 国内'] },
            { q:'最喜欢的电影类型？', opts:['😂 喜剧','😱 恐怖','💕 爱情','🚀 科幻','🎬 动画'] },
            { q:'苹果还是安卓？', opts:['🍎 苹果','🤖 安卓'] },
            { q:'最喜欢的音乐类型？', opts:['🎵 流行','🎸 摇滚','🎹 古典','🎤 说唱','🎧 民谣'] },
            { q:'宅家还是出门？', opts:['🏠 宅家','🚶 出门','看心情'] },
            { q:'吃香菜吗？', opts:['✅ 吃','❌ 不吃'] },
            { q:'早上洗澡还是晚上？', opts:['🌅 早上','🌙 晚上'] },
            { q:'计划型还是随性型？', opts:['📋 计划','🎲 随性'] },
            { q:'最喜欢的运动？', opts:['🏀 球类','🏊 游泳','🏃 跑步','🚴 骑行','😴 不运动'] },
            { q:'最喜欢的宠物？', opts:['🐱 猫','🐶 狗','🐹 仓鼠','🐟 鱼','🚫 不养'] },
            { q:'手机静音还是响铃？', opts:['🔇 静音','🔔 响铃','震动'] },
            { q:'最喜欢的节日？', opts:['🎄 圣诞','🧧 春节','🎃 万圣','🎂 生日'] },
            { q:'甜食还是咸食？', opts:['🍰 甜食','🍟 咸食','都爱'] },
            { q:'KTV必唱的歌的类型？', opts:['🎤 情歌','🔥 嗨歌','😢 伤感','🙊 不唱歌'] },
            { q:'最想拥有的超能力？', opts:['🛸 飞','⏰ 时间停止','🧠 读心','🫥 隐身'] },
            { q:'理想的一天从什么开始？', opts:['🛌 睡到自然醒','🏃 运动','🍳 做早餐','📱 刷手机'] },
            { q:'最喜欢的花？', opts:['🌹 玫瑰','🌻 向日葵','🌸 樱花','🌷 郁金香','💐 都行'] },
            { q:'拍照还是被拍？', opts:['📸 拍照','🤳 被拍','都行'] },
            { q:'最不能接受的食物？', opts:['🥒 苦瓜','🧅 洋葱','🫘 折耳根','🐸 奇怪肉类','没有'] },
            { q:'更喜欢哪种旅行方式？', opts:['🎒 背包客','🏨 度假','🚗 自驾','📷 打卡游'] },
            { q:'一个月不玩手机 vs 一个月不出门？', opts:['📵 不玩手机','🚪 不出门'] },
            { q:'如果中了一百万，第一件事做什么？', opts:['✈️ 旅游','🏠 买房','💰 存起来','🍽️ 吃大餐'] },
            { q:'更看重朋友的什么品质？', opts:['🤝 真诚','😂 幽默','🧠 智慧','💪 可靠'] },
            { q:'喜欢闹市还是安静的地方？', opts:['🏙️ 闹市','🌲 安静'] },
            { q:'一个人时喜欢做什么？', opts:['📺 看剧','🎮 游戏','📖 看书','🛒 逛街','🍳 做饭'] },
            { q:'最怕什么动物？', opts:['🐍 蛇','🕷️ 蜘蛛','🪳 蟑螂','🐭 老鼠','都不怕'] },
            { q:'面条还是米饭？', opts:['🍜 面条','🍚 米饭','都爱'] },
            { q:'想穿越到哪个时代？', opts:['🏛️ 古代','🎷 民国','🚀 未来','😎 现在挺好'] },
            { q:'最想学的新技能？', opts:['🎸 乐器','🍳 做饭','🗣️ 外语','💃 舞蹈','💻 编程'] },
            { q:'收到什么礼物最开心？', opts:['💌 手工','💰 实用','🌸 花','🎁 惊喜'] },
            { q:'如果只能带三样东西去荒岛？', opts:['🔪 刀','🔥 火源','📖 书','📱 手机(没信号)'] },
            { q:'觉得钱和时间哪个更重要？', opts:['💰 钱','⏰ 时间'] },
            { q:'更相信一见钟情还是日久生情？', opts:['💘 一见钟情','⏳ 日久生情'] },
            { q:'最喜欢的季节活动？', opts:['🏖️ 夏泳','⛄ 冬雪','🌸 春游','🍂 秋叶'] },
            { q:'房间整洁还是随性？', opts:['✨ 整洁','🤷 随性'] },
            { q:'最想去的迪士尼乐园？', opts:['🏰 上海','🗽 东京','🎡 香港','都不想去'] },
            { q:'如果变成动物一天，想变成什么？', opts:['🐱 猫','🐶 狗','🦅 鸟','🐬 海豚'] },
            { q:'喜欢单数还是双数？', opts:['1️⃣ 单数','2️⃣ 双数','没注意过'] },
            { q:'香菜、大蒜、姜，最不能接受哪个？', opts:['🌿 香菜','🧄 大蒜','🫚 姜','都能接受'] },
            { q:'最想和谁吃一顿饭？（在世的人）', opts:['🌟 偶像','👨‍👩‍👧 家人','🤝 朋友','😎 自己就好'] },
            { q:'你认为运气重要还是努力重要？', opts:['🍀 运气','💪 努力','都重要'] },
            { q:'最喜欢的冰淇淋口味？', opts:['🍫 巧克力','🍓 草莓','🍵 抹茶','🥛 香草'] },
        ];

        const truthQuestions = [
            '最近一次感到开心的事情是什么？',
            '最害怕失去什么？',
            '有什么别人不知道的隐藏技能？',
            '上一次哭是什么时候？因为什么？',
            '最想改掉的一个习惯？',
            '做过最尴尬的事情是什么？',
            '最让你感动的一件事？',
            '如果可以回到过去，最想改变什么？',
            '你觉得自己最大的优点是什么？',
            '最不喜欢自己哪一点？',
            '上一次撒谎是什么时候？',
            '最想和谁道歉？为什么？',
            '有没有一直想做但没做的事？',
            '最珍贵的童年回忆是什么？',
            '你最看重朋友的什么品质？',
            '有没有暗恋过谁不说出来？',
            '最想对现在的自己说的一句话？',
            '上一次生气是因为什么？',
            '做过最疯狂的事情是什么？',
            '最让你骄傲的一件事？',
            '最想去但还没去的地方？',
            '什么事情能让你瞬间开心？',
            '最讨厌别人对你做什么？',
            '觉得自己的缺点是什么？',
            '有没有后悔没做的事？',
            '最想学会的技能是什么？',
            '你觉得自己是理性还是感性的人？',
            '最近看的一部电影/书是什么？感觉如何？',
            '最想和谁互换一天人生？',
            '一年后的自己会是什么样子？',
        ];

        const dareQuestions = [
            '模仿一种动物叫声，让对方猜',
            '对视 30 秒，谁先笑谁输',
            '单脚站立 30 秒，不准扶东西',
            '用方言说一段深情的话',
            '做 10 个俯卧撑',
            '闭眼让对方画眉毛（手指比划即可）',
            '用三种不同的声音说"你好"',
            '即兴跳一段 15 秒的舞',
            '模仿三个表情包',
            '讲一个冷笑话，必须让对方笑',
            '把"我要减肥"唱出来',
            '扮鬼脸自拍一张给对方看',
            '用左手写对方的名字',
            '原地转 10 圈然后走直线',
            '用 rap 的方式介绍自己',
            '唱一首儿歌，要带动作',
            '闭眼猜对方伸出手指是几',
            '一边做深蹲一边背乘法口诀',
            '用最嗲的声音说一段话',
            '做 5 个仰卧起坐',
            '模仿对方说话的三种习惯',
            '闭眼画一只猫/狗给对方看',
            '用英文/方言说一段绕口令',
            '给对方按摩肩膀 30 秒',
            '摆一个最搞笑的姿势定格 10 秒',
        ];

        // ==================== 共同状态 ====================
        let activeGame = null;
        let quizIndex = 0, quizScore = 0, quizTotal = 0, quizAnswered = false;
        let rpsPickA = null, rpsPickB = null;
        let currentTDType = null;

        function createHearts() {
            const c = document.getElementById('heartsBg');
            const h = ['💕','💖','💗','💝','💘','❤️','💓','🩷','💌'];
            for(let i=0;i<18;i++){
                const s=document.createElement('span');s.className='heart-float';
                s.textContent=h[Math.floor(Math.random()*h.length)];
                s.style.left=Math.random()*95+'%';s.style.fontSize=(12+Math.random()*20)+'px';
                s.style.animationDuration=(8+Math.random()*14)+'s';s.style.animationDelay=Math.random()*10+'s';
                c.appendChild(s);
            }
        }

        // ==================== 导航 ====================
        function openGame(name) {
            document.getElementById('homePage').style.display='none';
            document.getElementById(name+'Page').classList.add('active');
            document.getElementById(name+'Page').style.display='block';
            if(name==='quiz') startQuiz();
            activeGame=name;
            window.scrollTo(0,0);
        }
        function goHome() {
            document.querySelectorAll('.game-page').forEach(p=>{p.classList.remove('active');p.style.display='none';});
            document.getElementById('homePage').style.display='block';
            activeGame=null;
            window.scrollTo(0,0);
        }

        // ==================== 默契大考验 ====================
        function startQuiz() {
            quizIndex=0;quizScore=0;quizTotal=0;quizAnswered=false;
            document.getElementById('quizEndCard').classList.add('hidden');
            document.getElementById('btnNextQuiz').classList.add('hidden');
            document.getElementById('btnReveal').classList.remove('hidden');
            showQuizQuestion();
        }
        function showQuizQuestion() {
            quizAnswered=false;
            const idx=quizIndex%quizQuestions.length;
            const q=quizQuestions[idx];
            document.getElementById('quizProgress').textContent=`第 ${quizTotal+1} 题 | 得分：${quizScore}`;
            document.getElementById('quizQuestion').textContent=q.q;
            document.getElementById('quizResult').textContent='';
            const optsDiv=document.getElementById('quizOptions');
            optsDiv.innerHTML='';
            q.opts.forEach((o,i)=>{
                const btn=document.createElement('div');
                btn.className='quiz-opt';btn.textContent=o;
                btn.onclick=function(){ if(quizAnswered)return;
                    optsDiv.querySelectorAll('.quiz-opt').forEach(b=>b.classList.remove('picked'));
                    btn.classList.add('picked');btn.setAttribute('data-pick',i);
                };
                optsDiv.appendChild(btn);
            });
            document.getElementById('btnReveal').classList.remove('hidden');
            document.getElementById('btnNextQuiz').classList.add('hidden');
        }
        function skipQuiz() {
            quizIndex++;quizTotal++;
            if(quizTotal>=10){ endQuiz();return; }
            showQuizQuestion();
        }
        function revealQuiz() {
            if(quizAnswered)return;
            const picked=document.querySelector('#quizOptions .picked');
            if(!picked){ showToast('请先选择一个答案~','info');return; }
            quizAnswered=true;
            const pickIdx=parseInt(picked.getAttribute('data-pick'));
            // 模拟对方也选一个（实际应用中双方各选，这里简化：对方随机选，默契=选到一样）
            const otherPick=Math.floor(Math.random()*quizQuestions[quizIndex%quizQuestions.length].opts.length);
            const opts=document.querySelectorAll('#quizOptions .quiz-opt');
            if(pickIdx===otherPick){ quizScore++;picked.classList.add('matched'); }
            else { picked.classList.add('mismatched');opts[otherPick].classList.add('matched'); }
            document.getElementById('quizResult').textContent=pickIdx===otherPick?'🎉 默契！想到一块了！':'💔 没对上，对方选了：'+opts[otherPick].textContent;
            document.getElementById('btnReveal').classList.add('hidden');
            document.getElementById('btnNextQuiz').classList.remove('hidden');
            quizTotal++;
        }
        function nextQuiz() {
            quizIndex++;
            if(quizTotal>=10){ endQuiz();return; }
            document.getElementById('btnNextQuiz').classList.add('hidden');
            showQuizQuestion();
        }
        function endQuiz() {
            document.getElementById('quizOptions').innerHTML='';
            document.getElementById('quizQuestion').textContent='';
            document.getElementById('quizResult').textContent='';
            document.getElementById('btnReveal').classList.add('hidden');
            document.getElementById('btnNextQuiz').classList.add('hidden');
            document.getElementById('quizEndCard').classList.remove('hidden');
            const pct=quizTotal>0?Math.round(quizScore/quizTotal*100):0;
            document.getElementById('quizFinalScore').textContent=pct+'%';
            document.getElementById('quizCorrect').textContent=quizScore;
            document.getElementById('quizTotal').textContent=quizTotal;
            document.getElementById('quizProgress').textContent='测试完成！';
        }
        function resetQuiz() {
            document.getElementById('quizEndCard').classList.add('hidden');
            startQuiz();
        }

        // ==================== 真心话大冒险 ====================
        function pickRPS(hand, player) {
            if(player==='A'){
                if(rpsPickA)return;
                rpsPickA=hand;
                document.querySelectorAll('#rpsButtons .rps-btn').forEach(b=>b.classList.remove('selected'));
                const idx={'✊':0,'✋':1,'✌️':2}[hand];
                ['rpsA','rpsB','rpsC'][idx]&&document.getElementById(['rpsA','rpsB','rpsC'][idx]).classList.add('selected');
            }else{
                if(rpsPickB)return;
                rpsPickB=hand;
            }
            if(rpsPickA&&rpsPickB) resolveRPS();
        }
        function resolveRPS() {
            document.getElementById('rpsPlayer1').textContent=rpsPickA;
            document.getElementById('rpsPlayer2').textContent=rpsPickB;
            document.getElementById('rpsShowArea').classList.remove('hidden');
            document.getElementById('rpsNextArea').classList.remove('hidden');
            let result='';
            if(rpsPickA===rpsPickB) result='🤝 平局！再来一次~';
            else if((rpsPickA==='✊'&&rpsPickB==='✌️')||(rpsPickA==='✋'&&rpsPickB==='✊')||(rpsPickA==='✌️'&&rpsPickB==='✋'))
                result='🎉 左边赢了！右边接受挑战';
            else result='🎉 右边赢了！左边接受挑战';
            document.getElementById('rpsResultText').textContent=result;
            if(result.includes('平局')){
                setTimeout(resetRPS,1500);
                return;
            }
            document.getElementById('tdLoserText').textContent=result;
            document.getElementById('tdChooseCard').classList.remove('hidden');
        }
        function resetRPS() {
            rpsPickA=null;rpsPickB=null;
            document.querySelectorAll('#rpsButtons .rps-btn').forEach(b=>b.classList.remove('selected'));
            document.getElementById('rpsShowArea').classList.add('hidden');
            document.getElementById('rpsNextArea').classList.add('hidden');
            document.getElementById('rpsResultText').textContent='';
            document.getElementById('tdChooseCard').classList.add('hidden');
            document.getElementById('tdCard').classList.add('hidden');
            document.getElementById('tdContent').innerHTML='';
        }
        function drawTD(type) {
            currentTDType=type;
            const pool=type==='truth'?truthQuestions:dareQuestions;
            const idx=Math.floor(Math.random()*pool.length);
            const label=type==='truth'?'<span class="td-label td-truth">🗣️ 真心话</span>':'<span class="td-label td-dare">⚡ 大冒险</span>';
            document.getElementById('tdContent').innerHTML=label+'<br>'+pool[idx];
            document.getElementById('tdCard').classList.remove('hidden');
        }
        function finishTD() {
            resetRPS();
            showToast('完成！继续猜拳~ ✊','success');
        }

        function showToast(msg,type) {
            const old=document.querySelector('.toast');if(old)old.remove();
            const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;
            document.body.appendChild(t);
            setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},2000);
        }

        createHearts();
    </script>
</body>
</html>
