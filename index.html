function seededRandom(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function shuffleSeeded(arr,seed){const rng=seededRandom(seed);const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ==================== MQTT 连接 ====================
let client=null;
let connected=false;
const BROKER='wss://broker.emqx.io:8084/mqtt';

function connectMQTT(){
    return new Promise((resolve)=>{
        client=mqtt.connect(BROKER,{clientId:'cg_'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:10000,reconnectPeriod:3000});
        client.on('connect',()=>{connected=true;resolve(true);});
        client.on('error',()=>{connected=false;resolve(false);});
        client.on('close',()=>{connected=false;});
        setTimeout(()=>{if(!connected)resolve(false);},8000);
    });
}

}

async function createRoom(){
    roomCode=String(Math.floor(100000+Math.random()*900000));
    amHost=true;myRole='host';
    r(`<div class="header"><div class="icon">⏳</div><h1>连接中...</h1><p class="connecting">正在建立连接</p></div>`);
    const ok=await connectMQTT();
    if(!ok){showToast('连接失败，请检查网络后重试','error');showHome();return;}
    client.subscribe('cpg/'+roomCode+'/#');
    listenMQTT();
    pub('host_join',{id:myRole});
    showLobby();
}

async function joinRoom(){
    const input=document.getElementById('joinCode');
    roomCode=input.value.trim();
    if(roomCode.length!==6){showToast('请输入6位房间码','error');return;}
    amHost=false;myRole='guest';
    r(`<div class="header"><div class="icon">⏳</div><h1>连接中...</h1><p class="connecting">正在加入房间 ${roomCode}</p></div>`);
    const ok=await connectMQTT();
    if(!ok){showToast('连接失败，请检查网络后重试','error');showHome();return;}
    client.subscribe('cpg/'+roomCode+'/#');
    listenMQTT();
    pub('guest_join',{id:myRole});
    showLobby();
}

function listenMQTT(){
    client.on('message',(topic,msg)=>{
        try{
            const data=JSON.parse(msg.toString());
            // 忽略自己发出的消息
            if(data.from===myRole)return;
            const parts=topic.split('/');
            const action=parts[2];
            
            if(action==='host_join'&&!amHost){otherOnline=true;pub('host_join',{id:myRole,from:myRole});showLobby();}
            if(action==='guest_join'&&amHost){otherOnline=true;pub('host_join',{id:myRole,from:myRole});showLobby();}
            
            if(action==='start_game'){
                currentGame=data.game;
                initGame(data.game,data.seed||0);
            }
            
            if(action==='quiz_answer'){
                if(!quizState)return;
                // 对方选的答案
                if(amHost)quizState.gAns=data.answer;else quizState.hAns=data.answer;
                // 检查自己是否也选了
                const myAns=amHost?quizState.hAns:quizState.gAns;
                if(myAns!=null&&!quizState.revealed){
                    quizState.revealed=true;
                    const matched=quizState.hAns===quizState.gAns;
                    if(matched)quizState.score++;
                    quizState.total++;
                    showQuizReveal(matched);
                }
            }
            
            if(action==='quiz_next'){
                if(!quizState)return;
                quizState.idx=data.idx;quizState.total=data.total;
                quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
                myQuizAnswer=null;
                if(quizState.total>=10)showQuizEnd();else showQuizUI();
            }
            
            if(action==='rps_pick'){
                if(!tdState)return;
                if(amHost)tdState.gRps=data.pick;else tdState.hRps=data.pick;
                const myPick=amHost?tdState.hRps:tdState.gRps;
                if(myPick!=null&&tdState.phase==='rps'){
                    resolveRPS();
                }
            }
            
            if(action==='td_choose'){if(!tdState)return;tdState.type=data.type;tdState.index=data.index;tdState.phase='show';showTDShow();}
            if(action==='td_next'){tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();}
            if(action==='td_redraw'){if(tdState)tdState.phase='choose';showTDChoose();}
            if(action==='back_lobby'){currentGame=null;quizState=null;tdState=null;myQuizAnswer=null;myRPSPick=null;showLobby();}
        }catch(e){}
    });
}

// ==================== 大厅 ====================
function showLobby(){
    const gName=currentGame==='quiz'?'默契大考验':'真心话大冒险';
    const gIcon=currentGame==='quiz'?'💕':'🎲';
    const myName=amHost?'玩家1':'玩家2';
    const otherName=amHost?'玩家2':'玩家1';
    r(`<div class="header"><div class="icon">${gIcon}</div><h1>${gName}</h1><p>房间 ${roomCode}</p>
        <p><span class="badge badge-me">${myName}（我）</span>
        ${otherOnline?`<span class="badge badge-other">${otherName} ✅</span>`:`<span class="badge badge-wait connecting">等待对方加入...</span>`}
        </p><div class="status-bar"><span class="dot ${connected?'dot-green':'dot-red'}"></span>${connected?'已连接':'连接中...'}</div></div>
        ${otherOnline?`<div class="card"><p class="mb-8" style="color:#9b8aad">双方都在了！</p>
            <button class="btn btn-primary btn-block" onclick="startGame()">🚀 开始游戏</button></div>`:
        `<div class="card"><p style="color:#b8a8cc">⏳ 等对方加入...</p><div class="room-code">${roomCode}</div>
            <button class="btn btn-sm btn-outline mt-8" onclick="copyCode()">📋 复制房间码</button></div>`}
        <button class="btn btn-sm btn-outline btn-block mt-12" onclick="leaveRoom()">🚪 离开房间</button>`);
}

function copyCode(){navigator.clipboard?.writeText(roomCode).then(()=>showToast('已复制！','success')).catch(()=>showToast('请手动记下房间码','info'));}

function startGame(){
    if(!otherOnline){showToast('等待对方加入~','info');return;}
    const seed=Math.floor(Math.random()*1000000);
    pub('start_game',{game:currentGame,seed:seed});
    initGame(currentGame,seed);
}
function initGame(game,seed){
    if(game==='quiz'){QUIZ=shuffleSeeded(QUIZ_RAW,seed);quizState={idx:0,score:0,total:0,hAns:null,gAns:null,revealed:false};myQuizAnswer=null;showQuizUI();}
    else{TRUTH=shuffleSeeded(TRUTH_RAW,seed);DARE=shuffleSeeded(DARE_RAW,seed);tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();}
}

function leaveRoom(){
    pub('back_lobby',{});
    if(client){try{client.end();}catch(e){}}client=null;connected=false;
    showHome();
}

// ==================== 默契大考验 ====================
function showQuizUI(){
    if(!quizState||quizState.total>=10){showQuizEnd();return;}
    const q=QUIZ[quizState.idx%QUIZ.length];
    const answered=myQuizAnswer!=null;
    r(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1><p>第${quizState.total+1}题 | 得分：${quizState.score} | 房间${roomCode}</p></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts">${q.opts.map((o,i)=>`<div class="quiz-opt ${answered?'locked':''}" onclick="pickQuiz(${i})" id="qo${i}">${o}</div>`).join('')}</div>
        <p style="color:#b8a8cc;font-size:11px;margin-top:6px">${answered?'✅ 已选，等对方...':'请选择你的答案'}</p>
        <button class="btn btn-sm btn-outline mt-8" onclick="skipQuizQ()">🔄 换一题</button>
    </div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function pickQuiz(idx){
    if(myQuizAnswer!=null)return;
    myQuizAnswer=idx;
    // 本地记录自己的答案
    if(amHost)quizState.hAns=idx;else quizState.gAns=idx;
    document.querySelectorAll('.quiz-opt').forEach((b,i)=>{b.classList.add('locked');if(i===idx)b.classList.add('picked');});
    pub('quiz_answer',{answer:idx});
    // 检查对方是否也答了
    const otherAns=amHost?quizState.gAns:quizState.hAns;
    if(otherAns!=null){
        quizState.revealed=true;
        const matched=quizState.hAns===quizState.gAns;
        if(matched)quizState.score++;
        quizState.total++;
        showQuizReveal(matched);
    }
}

function showQuizReveal(matched){
    const q=QUIZ[quizState.idx%QUIZ.length];
    const myAns=amHost?quizState.hAns:quizState.gAns;
    const otherAns=amHost?quizState.gAns:quizState.hAns;
    r(`<div class="header"><div class="icon">💕</div><h1>默契大考验</h1></div>
    <div class="card">
        <div class="quiz-q">${q.q}</div>
        <div style="display:flex;justify-content:center;gap:16px;margin:10px 0"><div style="text-align:center"><small>你</small><br><b>${q.opts[myAns]}</b></div><div style="color:#c8b8d8;align-self:center">VS</div><div style="text-align:center"><small>对方</small><br><b>${q.opts[otherAns]}</b></div></div>
        <div style="font-weight:700;font-size:15px;color:${matched?'#22c55e':'#ef4444'}">${matched?'🎉 默契！想到一块了！':'💔 不一样哦~'}</div>
        <button class="btn btn-primary mt-12" onclick="nextQuizQ()">下一题 →</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="skipQuizQ()">🔄 换一题</button></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function nextQuizQ(){
    if(!quizState)return;
    quizState.idx++;quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
    quizState.total++;myQuizAnswer=null;
    pub('quiz_next',{idx:quizState.idx,total:quizState.total});
    if(quizState.total>=10)showQuizEnd();else showQuizUI();
}

function skipQuizQ(){
    if(!quizState)return;
    quizState.idx++;quizState.hAns=null;quizState.gAns=null;quizState.revealed=false;
    quizState.total++;myQuizAnswer=null;
    pub('quiz_next',{idx:quizState.idx,total:quizState.total});
    if(quizState.total>=10)showQuizEnd();else showQuizUI();
}

function showQuizEnd(){
    const pct=quizState.total>0?Math.round(quizState.score/quizState.total*100):0;
    r(`<div class="header"><div class="icon">🎉</div><h1>测试结束！</h1></div>
    <div class="card"><div style="font-size:44px;font-weight:900;color:#c44dff">${pct}%</div><p style="color:#9b8aad">答对 ${quizState.score}/${quizState.total} 题</p>
        <button class="btn btn-primary mt-8" onclick="startGame()">再来一次</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">返回房间</button></div>`);
}

// ==================== 真心话大冒险 ====================
function showRPSUI(){
    const locked=myRPSPick!=null?'locked':'';
    r(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1><p>猜拳定胜负 | 房间${roomCode}</p></div>
    <div class="card"><p class="mb-8" style="color:#9b8aad">双方同时出手！</p>
        <div class="rps-row"><button class="rps-btn ${locked}" onclick="pickRPS('✊')">✊</button><button class="rps-btn ${locked}" onclick="pickRPS('✋')">✋</button><button class="rps-btn ${locked}" onclick="pickRPS('✌️')">✌️</button></div>
        <p style="color:#b8a8cc;font-size:11px">${myRPSPick!=null?'✅ 已出，等对方...':'请出手！'}</p></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function pickRPS(hand){
    if(myRPSPick!=null)return;
    myRPSPick=hand;
    if(amHost)tdState.hRps=hand;else tdState.gRps=hand;
    document.querySelectorAll('.rps-btn').forEach(b=>{b.classList.add('locked');if(b.textContent===hand)b.classList.add('picked')});
    pub('rps_pick',{pick:hand});
    const otherPick=amHost?tdState.gRps:tdState.hRps;
    if(otherPick!=null&&tdState.phase==='rps'){resolveRPS();}
}

function resolveRPS(){
    const h=tdState.hRps,g=tdState.gRps;
    let result,loser;
    if(h===g){result='🤝 平局！';loser=null;}
    else if((h==='✊'&&g==='✌️')||(h==='✋'&&g==='✊')||(h==='✌️'&&g==='✋')){result='玩家1赢了！';loser='guest';}
    else{result='玩家2赢了！';loser='host';}
    tdState.result=result;tdState.loser=loser;
    if(loser){tdState.phase='choose';showTDChoose();}
    else{setTimeout(()=>{tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();},1500);}
    const myPick=amHost?h:g;
    const otherPick=amHost?g:h;
    r(`<div class="header"><div class="icon">✊</div><h1>真心话大冒险</h1></div>
    <div class="card">
        <div style="display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0"><div style="text-align:center"><div style="font-size:36px">${myPick}</div><small>你</small></div><div>VS</div><div style="text-align:center"><div style="font-size:36px">${otherPick}</div><small>对方</small></div></div>
        <p style="font-weight:700;font-size:16px">${result}</p></div>`);
}

function showTDChoose(){
    const iAmLoser=(tdState.loser==='host'&&amHost)||(tdState.loser==='guest'&&!amHost);
    if(iAmLoser){r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${tdState.result}</p><p style="color:#9b8aad" class="mb-8">你输了！选挑战：</p>
            <button class="btn btn-primary btn-block" onclick="chooseTD('truth')" style="background:linear-gradient(135deg,#ff4d6a,#ff6b9d)">🗣️ 真心话</button>
            <button class="btn btn-primary btn-block mt-8" onclick="chooseTD('dare')" style="background:linear-gradient(135deg,#4d6aff,#6b9dff)">⚡ 大冒险</button></div>`);}
    else{r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
        <div class="card"><p style="font-weight:700" class="mb-8">${tdState.result}</p><p style="color:#b8a8cc">⏳ 等对方选挑战...</p></div>`);}
}

function chooseTD(type){
    const pool=type==='truth'?TRUTH:DARE;
    const idx=Math.floor(Math.random()*pool.length);
    tdState.type=type;tdState.index=idx;
    pub('td_choose',{type,index:idx});
    showTDShow();
}

function showTDShow(){
    const pool=(tdState.type==='truth'?TRUTH:DARE);
    const content=pool[tdState.index]||pool[0];
    r(`<div class="header"><div class="icon">🎲</div><h1>真心话大冒险</h1></div>
    <div class="card"><div class="td-card"><div><span class="tag ${tdState.type==='truth'?'tag-truth':'tag-dare'}">${tdState.type==='truth'?'🗣️ 真心话':'⚡ 大冒险'}</span><div>${content}</div></div></div>
        <p style="color:#b8a8cc;font-size:11px">完成挑战后继续~</p>
        <button class="btn btn-primary mt-8" onclick="nextTD()">✅ 完成！继续</button>
        <button class="btn btn-sm btn-outline btn-block mt-8" onclick="redrawTD()">🔄 换一个</button></div>
    <button class="btn btn-sm btn-outline btn-block mt-8" onclick="leaveRoom()">← 离开房间</button>`);
}

function nextTD(){pub('td_next',{});tdState={phase:'rps',hRps:null,gRps:null,result:null,loser:null,type:null,index:null};myRPSPick=null;showRPSUI();}
function redrawTD(){pub('td_redraw',{});showTDChoose();}

// ==================== Toast ====================
function showToast(msg,type){
    const old=document.querySelector('.toast');if(old)old.remove();
    const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},2000);
}

// ==================== 爱心 ====================
(function(){
    const c=document.getElementById('heartsBg');
    const h=['💕','💖','💗','💝','💘','❤️','💓'];
    for(let i=0;i<14;i++){
        const s=document.createElement('span');s.className='heart-float';
        s.textContent=h[Math.floor(Math.random()*h.length)];
        s.style.left=Math.random()*95+'%';s.style.fontSize=(12+Math.random()*18)+'px';
        s.style.animationDuration=(8+Math.random()*14)+'s';s.style.animationDelay=Math.random()*10+'s';
        c.appendChild(s);
    }
})();

showHome();
</script>
</body>
</html>
